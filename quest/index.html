<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07040f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="행운의 궁전">
  <title>행운의 궁전</title>
  <meta name="description" content="사천성 · 틀린그림찾기 · 슬롯머신이 하나의 모험으로 이어지는 퍼즐 어드벤처">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Han+Sans&family=Black+Ops+One&family=Bungee&family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@700;900&family=Creepster&family=Fredoka:wght@500;700&family=Kaushan+Script&family=Monoton&family=Mountains+of+Christmas:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&family=Orbitron:wght@700;900&family=Oxanium:wght@600;700;800&family=Pirata+One&family=Playfair+Display:wght@700;900&family=Press+Start+2P&family=Righteous&family=Rye&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/slot.css">
  <link rel="stylesheet" href="css/quest.css">
</head>
<body>
  <canvas id="bgl" aria-hidden="true"></canvas>
  <canvas id="amb" aria-hidden="true"></canvas>

  <!-- title -->
  <section id="title" class="title-screen">
    <div class="ts-glow"></div>
    <div class="ts-fox">🦊</div>
    <h1 class="ts-logo">행운의 궁전</h1>
    <p class="ts-sub">PALACE OF FORTUNE</p>
    <p class="ts-tag">사천성 · 틀린그림찾기 · 슬롯머신 — 하나로 이어지는 모험</p>
    <button class="cta ts-start" id="ts-start">터치해서 시작</button>
    <p class="ts-foot">가상 코인 게임입니다</p>
  </section>

  <!-- puzzle screen -->
  <section id="play" class="play hidden">
    <header class="q-top">
      <button class="icon-btn js-menu" aria-label="메뉴"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <div class="q-level js-level"><b class="js-lv">1</b><i><em class="js-xp"></em></i></div>
      <button class="wallet q-wallet js-shop"><span class="coin-ico"></span><span class="js-balance">0</span><span class="plus">+</span></button>
      <button class="icon-btn js-quests" aria-label="퀘스트"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z" fill="none" stroke-width="2"/><path d="M9 10h6M9 14h6M9 18h4" fill="none" stroke-width="2" stroke-linecap="round"/></svg><span class="dot js-qdot hidden"></span></button>
      <button class="icon-btn js-sound" aria-label="사운드 설정"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg></button>
    </header>
    <div class="q-chapter js-chapter"></div>
    <div class="mg-host js-mg"></div>
  </section>

  <!-- Game -->
  <section id="game" class="game hidden">
    <header class="g-top">
      <button class="icon-btn js-back" aria-label="로비로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="wallet"><span class="coin-ico"></span><span class="js-balance">0</span></div>
      <div class="g-right">
        <button class="icon-btn js-pay" aria-label="배당표"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke-width="2"/><path d="M12 11v6" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.4"/></svg></button>
        <button class="icon-btn js-sound" aria-label="사운드 설정"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <div class="g-logo">
      <h2 class="logo js-logo"></h2>
      <div class="logo-kr js-name"></div>
    </div>
    <div class="g-info js-info"></div>
    <div class="g-stage js-stage">
      <div class="cab js-cab">
        <div class="frame js-frame">
          <div class="led led-top"></div>
          <canvas class="reels js-reels"></canvas>
          <div class="frame-glare"></div>
          <div class="win-banner js-banner" aria-live="polite">
            <div class="wb-rays"></div>
            <div class="wb-label js-wb-label">WIN</div>
            <div class="wb-amt js-wb-amt">0</div>
          </div>
          <div class="led led-bot"></div>
          <i class="bolt b1"></i><i class="bolt b2"></i><i class="bolt b3"></i><i class="bolt b4"></i>
        </div>
        <div class="lever js-lever hidden" role="button" tabindex="0" aria-label="레버를 당겨 스핀">
          <div class="lever-housing"></div>
          <div class="lever-shaft js-lever-shaft"></div>
          <div class="lever-knob js-lever-knob"></div>
          <div class="lever-pivot"></div>
        </div>
      </div>
    </div>
    <div class="g-msg js-msg"></div>
    <footer class="dock">
      <div class="dock-stat bet">
        <span class="lbl">BET</span>
        <div class="stepper">
          <button class="step js-bet-down" aria-label="베팅 감소"><svg viewBox="0 0 24 24"><path d="M6 12h12" stroke-width="3" stroke-linecap="round"/></svg></button>
          <span class="val js-bet">100</span>
          <button class="step js-bet-up" aria-label="베팅 증가"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" stroke-width="3" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <div class="dock-center">
        <button class="round-btn js-auto" aria-label="자동 스핀"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><small class="js-auto-label">AUTO</small></button>
        <button class="pull-hint js-pull-hint hidden" aria-label="레버 당기기"><span>PULL</span><svg viewBox="0 0 24 24"><path d="M12 4v13M6 12l6 6 6-6" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="spin-btn js-spin" aria-label="스핀 (Space)">
          <span class="spin-ring"></span>
          <svg class="spin-ico" viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 1-14.4 9" fill="none" stroke-width="5" stroke-linecap="round"/><path d="M4 12l6 6 6-7z"/></svg>
          <small class="js-spin-label">SPIN</small>
        </button>
        <button class="round-btn js-turbo" aria-label="터보"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><small>TURBO</small></button>
      </div>
      <div class="dock-stat win">
        <span class="lbl">WIN</span>
        <span class="val js-win">0</span>
      </div>
    </footer>
    <div class="auto-menu hidden js-auto-menu">
      <button data-n="10">10</button><button data-n="25">25</button><button data-n="50">50</button><button data-n="100">100</button><button data-n="9999">∞</button>
    </div>
  </section>

  <div class="slot-quest js-slotq hidden"></div>

  <div id="overlays"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div id="sound-panel" class="sound-panel hidden">
    <h3>사운드</h3>
    <div class="vol-row"><label for="snd-music">배경 음악</label><input type="range" id="snd-music" min="0" max="100" step="1" value="80"><output for="snd-music">80</output></div>
    <div class="vol-row"><label for="snd-sfx">효과음</label><input type="range" id="snd-sfx" min="0" max="100" step="1" value="100"><output for="snd-sfx">100</output></div>
    <div class="vol-row"><label for="snd-amb">분위기음</label><input type="range" id="snd-amb" min="0" max="100" step="1" value="80"><output for="snd-amb">80</output></div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/machines.js"></script>
  <script src="js/calibration.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/bg.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/shisen.js"></script>
  <script src="js/spotdiff.js"></script>
  <script src="js/story.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
